name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Clean installation with specific steps to handle native bindings
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps
          # Rebuild native modules
          npm rebuild

      # Alternative: Reinstall tailwindcss-oxide specifically
      - name: Fix Tailwind native binding
        run: |
          npm rebuild @tailwindcss/oxide
          npm install --force

      - name: Build project
        run: npm run build
        env:
          VITE_APP_ENV: production

      - name: Deploy to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
