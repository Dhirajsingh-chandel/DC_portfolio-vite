name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # or master, depending on your default branch
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # or your preferred version
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the project
      - name: Build project
        run: npm run build
        env:
          VITE_APP_ENV: production # Add any environment variables needed

      # Step 5: Deploy to Hostinger via FTP
      - name: Deploy to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/  # Vite builds to 'dist' by default
          server-dir: ${{ secrets.FTP_TARGET_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          # Optional: exclude certain files/folders
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.*/**