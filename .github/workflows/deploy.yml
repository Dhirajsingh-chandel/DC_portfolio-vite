name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Force install Linux native binding
        run: |
          # Install the specific Linux binary for tailwindcss-oxide
          pnpm add @tailwindcss/oxide-linux-x64-gnu -D

      - name: Install all dependencies
        run: |
          rm -rf node_modules pnpm-lock.yaml  # Start fresh
          pnpm install

      - name: Build project
        run: pnpm run build
        env:
          VITE_APP_ENV: production

      - name: Deploy to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
