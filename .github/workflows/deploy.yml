name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Don't cache npm here - we're removing the lockfile

      - name: Install dependencies (fixed for native bindings)
        run: |
          rm -f package-lock.json  # Remove broken lockfile
          npm cache clean --force  # Clean cache
          npm install              # Fresh install on CI runner

      - name: Build project
        run: npm run build
        env:
          VITE_APP_ENV: production

      - name: Deploy to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
